[project]
name = "lecturelab"
version = "0.1.0"
description = "Local-first lecture recorder and study assistant"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.0",
    "fastapi>=0.142.4",
    "faster-whisper>=1.2.1",
    "httpx2>=2.13.1",
    "keyring>=25.7.0",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "soundcard>=0.4.6",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
lecturelab = "backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "backend/core/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
