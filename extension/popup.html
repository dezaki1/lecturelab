<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LectureLab</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <strong>LectureLab</strong>
      <span id="status" class="status">Connecting…</span>
    </header>

    <p id="error" class="error" hidden></p>

    <section id="watch" class="watch" hidden>
      <h2>New recordings from this course</h2>
      <p id="watch-status" class="muted small"></p>
      <div id="watch-fields" class="row">
        <label class="grow">
          Into subject
          <select id="watch-subject"></select>
        </label>
        <label>
          Type
          <select id="watch-kind">
            <option value="">From title</option>
            <option>VL</option>
            <option>VO</option>
            <option>UE</option>
          </select>
        </label>
      </div>
      <button id="watch-btn">Watch this course</button>
    </section>

    <section id="form" hidden>
      <div class="modes" role="radiogroup" aria-label="What to do">
        <label><input type="radio" name="mode" value="study" checked /> Add to LectureLab</label>
        <label><input type="radio" name="mode" value="save" /> Just download</label>
      </div>
      <div id="study-fields">
        <label>
          Subject
          <select id="subject"></select>
        </label>
        <div class="row">
          <label class="grow">
            Title <span class="muted">(optional)</span>
            <input id="title" placeholder="Taken from the video" />
          </label>
          <label>
            Type
            <select id="kind">
              <option value="">–</option>
              <option>VL</option>
              <option>VO</option>
              <option>UE</option>
              <option value="other">Other</option>
            </select>
          </label>
        </div>
      </div>
      <label class="check"
        ><input type="checkbox" id="video" checked />
        <span id="video-label">Download the video (to find slides)</span></label
      >
      <label class="check"
        ><input type="checkbox" id="cookies" checked /> Send my login for this site (needed for Moodle,
        Panopto…)</label
      >

      <h2>This page</h2>
      <ul id="page" class="items"></ul>

      <h2>Found while playing <span id="count" class="muted"></span></h2>
      <ul id="media" class="items"></ul>
      <p id="empty" class="muted small">
        Nothing yet. Start the video on the page and it shows up here. If the page itself works above, prefer
        that.
      </p>
    </section>

    <footer>
      <a href="#" id="open">Open LectureLab</a>
      <a href="#" id="folder" hidden>Downloads folder</a>
      <a href="#" id="options">Settings</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
